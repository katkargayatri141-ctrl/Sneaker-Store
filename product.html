<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link rel="stylesheet" href="product.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h2><span>Thala</span>7.</h2>
            </div>

            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#brands">Brands<i class="fa fa-angle-down"></i></a></li>
                <li><a href="#more">More<i class="fa fa-angle-down"></i></a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

            <div class="right">
                <div class="search">
                    <i class="fa fa-search"></i>
                    <input type="text" placeholder="Search">
                </div>
                <div class="cart">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>0</span>
                </div>
                <img src="https://tse2.mm.bing.net/th/id/OIP.CIn8fInVEpY4ti24C9LfWgHaFJ?r=0&pid=Api&P=0&h=180" alt="Profile">
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="left">
            <div class="main-image">
                <img src="shoe1.png" alt="shoe">
            </div>
            <div class="gallery">
                <img src="shoe2.png">
                <img src="shoe3.png">
                <img src="shoe4.png">
            </div>
        </div>

        <div class="right-product">
            <h1>Seven By M.S.Dhoni Women's Hogun Multi-Color Running Shoes</h1>
            <p>For exceptional fit, feel and smooth transitions get going with these dual mid sole technology shoes.</p>
            <div class="price">
                <h2>₹1,334</h2>
                 <div>
                    <h3>Save 12%</h3>
                    <p>Inclusive of all Taxes</p>
                 </div>
            </div>
            <div class="cart-section">
                <select>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>   
                </select>
                <a href="cart.html">
                <button>
                    <i class="fa-solid fa-cart-shopping"></i>
                    ADD TO CART
                </button>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
